# Builds the Payline Generator Windows installer and publishes it as a GitHub Release whenever the version in
# package.json changes on main. Installed apps pick the new release up automatically.
name: Release

on:
  push:
    branches: [main]
    paths: [package.json, release-notes.md, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # A release only counts as done when latest.yml is on it; a half-uploaded one is rebuilt.
          if gh release view "v$VERSION" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx latest.yml; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION already exists, nothing to build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # Fails the build if release-notes.md isn't written for this version.
      - run: node scripts/release-notes.js
      # Build only; uploading is done below in one step. electron-builder's own upload could leave a
      # half-made release ("Published releases must have a valid tag"). latest.yml is still written
      # because package.json has a publish provider. bash, not PowerShell, which mangles -c.releaseInfo...
      - run: npx electron-builder --win nsis --x64 --publish never -c.releaseInfo.releaseNotesFile=build/release-notes.md
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Replaces a half-finished release of the same version, then uploads installer + latest.yml
      # (what installed apps read to find updates) with the notes as the release body.
      - run: |
          TAG="v${{ needs.check.outputs.version }}"
          gh release delete "$TAG" --cleanup-tag -y 2>/dev/null || true
          gh release create "$TAG" dist/*.exe dist/*.blockmap dist/latest.yml \
            --title "$TAG" --notes-file build/release-notes.md --target "$GITHUB_SHA"
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
